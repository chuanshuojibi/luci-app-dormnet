name: Build IPK (Fast)

# 直接用 GitHub Runner 自带 Go 交叉编译 + 手工打 ipk，绕过 OpenWrt SDK
# 整个流程 1-2 分钟，首次也快

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ipk-fast.yml'
      - 'dormnet/**'
      - 'dormnet-src/**'
      - 'luci-app-dormnet/**'

concurrency:
  group: build-ipk-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_arch: x86_64
            goarch: amd64
            goarm: ''
            gomips: ''
          # 需要更多架构时按下方格式追加
          # - openwrt_arch: aarch64_cortex-a53
          #   goarch: arm64
          # - openwrt_arch: arm_cortex-a7_neon-vfpv4
          #   goarch: arm
          #   goarm: '7'
          # - openwrt_arch: mipsel_24kc
          #   goarch: mipsle
          #   gomips: softfloat

    env:
      PKG_VERSION: 0.1.0
      PKG_RELEASE: 4
      GO_PKG: github.com/openwrt-dormnet/dormnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dormnet-src/go.mod
          cache-dependency-path: dormnet-src/go.sum

      - name: Cross-compile dormnet
        working-directory: dormnet-src
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
        run: |
          set -e
          BUILD_TIME=$(date -u -Iseconds)
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w \
              -X ${GO_PKG}/internal/constants.version=${PKG_VERSION} \
              -X ${GO_PKG}/internal/constants.buildTime=${BUILD_TIME}" \
            -o ../dist/dormnet ./cmd/dormnet
          file ../dist/dormnet

      - name: Build po2lmo (LuCI i18n compiler)
        run: |
          set -e
          # 浅克隆 luci 仅取需要的子目录，~5 秒
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/openwrt/luci.git tools/luci
          ( cd tools/luci && git sparse-checkout set modules/luci-base/src )
          make -C tools/luci/modules/luci-base/src po2lmo
          echo "PO2LMO=$PWD/tools/luci/modules/luci-base/src/po2lmo" >> "$GITHUB_ENV"
          ls -l tools/luci/modules/luci-base/src/po2lmo

      - name: Assemble ipk packages
        env:
          ARCH: ${{ matrix.openwrt_arch }}
        run: |
          set -e
          OUT=artifacts
          mkdir -p "$OUT"

          pack_ipk() {
            # $1=pkg name, $2=arch, $3=root dir, $4=control dir, $5=output ipk
            local name="$1" arch="$2" root="$3" ctrl="$4" out="$5"
            local work TS=1577836800   # 2020-01-01 UTC，固定时间戳保证可复现
            work=$(mktemp -d)

            # data.tar.gz: 实际安装的文件树
            tar --format=gnu --numeric-owner --sort=name --owner=0 --group=0 \
                --mtime="@$TS" -cf - -C "$root" . | gzip -n > "$work/data.tar.gz"

            # control.tar.gz: 控制元数据
            tar --format=gnu --numeric-owner --sort=name --owner=0 --group=0 \
                --mtime="@$TS" -cf - -C "$ctrl" . | gzip -n > "$work/control.tar.gz"

            printf '2.0\n' > "$work/debian-binary"

            # ipk = gzipped tar 包含 debian-binary + data.tar.gz + control.tar.gz
            # （注意：不是 ar 归档！这是 OpenWrt 的 .ipk 格式，对照 openwrt/scripts/ipkg-build）
            ( cd "$work" && tar --format=gnu --numeric-owner --sort=name \
                --owner=0 --group=0 --mtime="@$TS" -cf - \
                ./debian-binary ./data.tar.gz ./control.tar.gz \
                | gzip -n > "$out" )

            echo "== Built $out =="
            ls -lh "$out"
            echo "-- ipk top-level --"
            tar -tzf "$out"
          }

          ##################### dormnet #####################
          PKG=dormnet
          ROOT=$(mktemp -d); CTRL=$(mktemp -d)
          install -Dm755 dist/dormnet "$ROOT/usr/bin/dormnet"
          install -Dm755 dormnet/root/etc/init.d/dormnet "$ROOT/etc/init.d/dormnet"
          # 默认 UCI 配置：LuCI 和 Go 程序都读 /etc/config/dormnet
          install -d "$ROOT/etc/config"
          cat > "$ROOT/etc/config/dormnet" <<'UCI'
          config basic 'basic'
              option enabled '0'
              option work_mode 'master'
              option listen '127.0.0.1:10721'

          config airkv 'airkv'
              option store_path '/etc/dormnet/airkv'
          UCI
          # 安装后自动 reload，可保证服务在新配置下重启
          install -d "$ROOT/etc/uci-defaults"
          cat > "$ROOT/etc/uci-defaults/80-dormnet" <<'UDEF'
          #!/bin/sh
          [ -x /etc/init.d/dormnet ] && /etc/init.d/dormnet enable
          exit 0
          UDEF
          chmod 0755 "$ROOT/etc/uci-defaults/80-dormnet"
          cat > "$CTRL/control" <<EOF
          Package: ${PKG}
          Version: ${PKG_VERSION}-${PKG_RELEASE}
          Architecture: ${ARCH}
          Maintainer: Haven Madray <sgpublic2002@gmail.com>
          Section: net
          Priority: optional
          Depends: luci-app-mwan3
          Description: Manage your campus network with DormNet on OpenWrt.
          EOF
          echo '/etc/config/dormnet' > "$CTRL/conffiles"
          # postinst：装完后启用并启动服务、跑 uci-defaults
          cat > "$CTRL/postinst" <<'POST'
          #!/bin/sh
          [ -n "$IPKG_INSTROOT" ] && exit 0
          if [ -x /etc/init.d/dormnet ]; then
              /etc/init.d/dormnet enable
              /etc/init.d/dormnet restart >/dev/null 2>&1
          fi
          for f in /etc/uci-defaults/80-dormnet; do
              [ -f "$f" ] && ( . "$f" ) && rm -f "$f"
          done
          exit 0
          POST
          chmod 0755 "$CTRL/postinst"
          # prerm：卸载前停服务
          cat > "$CTRL/prerm" <<'PRE'
          #!/bin/sh
          [ -n "$IPKG_INSTROOT" ] && exit 0
          if [ -x /etc/init.d/dormnet ]; then
              /etc/init.d/dormnet stop >/dev/null 2>&1
              /etc/init.d/dormnet disable
          fi
          exit 0
          PRE
          chmod 0755 "$CTRL/prerm"
          pack_ipk "$PKG" "$ARCH" "$ROOT" "$CTRL" \
            "$PWD/$OUT/${PKG}_${PKG_VERSION}-${PKG_RELEASE}_${ARCH}.ipk"

          ##################### luci-app-dormnet #####################
          PKG=luci-app-dormnet
          ROOT=$(mktemp -d); CTRL=$(mktemp -d)
          mkdir -p "$ROOT/www/luci-static"
          cp -a luci-app-dormnet/htdocs/luci-static/. "$ROOT/www/luci-static/"
          cp -a luci-app-dormnet/root/. "$ROOT/"
          mkdir -p "$ROOT/usr/lib/lua/luci/i18n"
          # zh_Hans -> LuCI 命名 zh-cn
          "$PO2LMO" \
            luci-app-dormnet/po/zh_Hans/dormnet.po \
            "$ROOT/usr/lib/lua/luci/i18n/dormnet.zh-cn.lmo"
          cat > "$CTRL/control" <<EOF
          Package: ${PKG}
          Version: ${PKG_VERSION}-${PKG_RELEASE}
          Architecture: all
          Maintainer: Haven Madray <sgpublic2002@gmail.com>
          Section: luci
          Priority: optional
          Depends: luci-base, dormnet, rpcd-mod-ucode, ucode-mod-fs
          Description: LuCI Dormnet module.
          EOF
          # postinst：清 luci 缓存 + 重载 rpcd 注册我们的 ubus 对象
          cat > "$CTRL/postinst" <<'POST'
          #!/bin/sh
          [ -n "$IPKG_INSTROOT" ] && exit 0
          rm -rf /tmp/luci-indexcache /tmp/luci-modulecache 2>/dev/null
          /etc/init.d/rpcd reload >/dev/null 2>&1
          /etc/init.d/uhttpd restart >/dev/null 2>&1
          exit 0
          POST
          chmod 0755 "$CTRL/postinst"
          cat > "$CTRL/postrm" <<'POSTRM'
          #!/bin/sh
          [ -n "$IPKG_INSTROOT" ] && exit 0
          rm -rf /tmp/luci-indexcache /tmp/luci-modulecache 2>/dev/null
          /etc/init.d/rpcd reload >/dev/null 2>&1
          exit 0
          POSTRM
          chmod 0755 "$CTRL/postrm"
          pack_ipk "$PKG" all "$ROOT" "$CTRL" \
            "$PWD/$OUT/${PKG}_${PKG_VERSION}-${PKG_RELEASE}_all.ipk"

          echo '== artifacts =='
          ls -lh "$OUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dormnet-ipk-${{ matrix.openwrt_arch }}
          path: artifacts/*.ipk
          if-no-files-found: error
