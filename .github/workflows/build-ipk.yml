name: Build IPK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ipk.yml'
      - 'dormnet/**'
      - 'dormnet-src/**'
      - 'luci-app-dormnet/**'

concurrency:
  group: build-ipk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86-64:
    runs-on: ubuntu-24.04

    env:
      SDK_URL: https://downloads.openwrt.org/releases/24.10.2/targets/x86/64/openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_ARCHIVE: openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIR: openwrt-sdk
      GOPROXY: https://proxy.golang.org,direct

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gettext git python3-setuptools rsync \
            file wget xz-utils zstd

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: openwrt-sdk-24.10.2-x86-64-gcc-13.3.0-musl-v1
          restore-keys: |
            openwrt-sdk-24.10.2-x86-64-gcc-13.3.0-musl-

      - name: Download OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -O "$SDK_ARCHIVE" "$SDK_URL"
          tar --zstd -xf "$SDK_ARCHIVE"
          mv openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64 "$SDK_DIR"

      - name: Verify prebuilt SDK toolchain
        run: |
          test -d "$SDK_DIR/staging_dir/toolchain-x86_64_gcc-13.3.0_musl"
          test -x "$SDK_DIR/staging_dir/toolchain-x86_64_gcc-13.3.0_musl/bin/x86_64-openwrt-linux-musl-gcc"
          "$SDK_DIR/staging_dir/toolchain-x86_64_gcc-13.3.0_musl/bin/x86_64-openwrt-linux-musl-gcc" --version

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}/dl
          key: openwrt-dl-24.10.2-x86-64-${{ hashFiles('dormnet-src/go.sum') }}
          restore-keys: |
            openwrt-dl-24.10.2-x86-64-

      - name: Cache OpenWrt feeds
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK_DIR }}/feeds
            ${{ env.SDK_DIR }}/package/feeds
          key: openwrt-feeds-24.10.2-v1-${{ hashFiles('.github/workflows/build-ipk.yml') }}
          restore-keys: |
            openwrt-feeds-24.10.2-v1-

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-openwrt-24.10.2-x86-64-${{ hashFiles('dormnet-src/go.sum') }}
          restore-keys: |
            go-openwrt-24.10.2-x86-64-

      - name: Prepare package links
        run: |
          rm -rf "$SDK_DIR/package/dormnet" "$SDK_DIR/package/luci-app-dormnet"
          rm -rf "$SDK_DIR/build_dir/target-"*/dormnet-* "$SDK_DIR/build_dir/target-"*/luci-app-dormnet-*
          ln -s "$GITHUB_WORKSPACE/dormnet" "$SDK_DIR/package/dormnet"
          ln -s "$GITHUB_WORKSPACE/luci-app-dormnet" "$SDK_DIR/package/luci-app-dormnet"

      - name: Slim feeds.conf (drop routing & telephony)
        working-directory: ${{ env.SDK_DIR }}
        run: |
          sed -i -E '/^src-git (routing|telephony) /d' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds (packages + luci only)
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install golang golang-build luci-base luci-compat

      - name: Configure packages
        working-directory: ${{ env.SDK_DIR }}
        run: |
          cat <<'EOF' > .config
          CONFIG_PACKAGE_dormnet=m
          CONFIG_PACKAGE_luci-app-dormnet=m
          EOF
          make defconfig

      - name: Build packages with SDK prebuilt toolchain
        working-directory: ${{ env.SDK_DIR }}
        run: |
          make -j$(nproc) \
            package/dormnet/compile \
            package/luci-app-dormnet/compile \
            BUILD_LOG=1 || {
              echo '::group::build logs'
              find logs -type f -name '*.txt' -exec sh -c 'echo "--- {} ---"; cat {}' \;
              echo '::endgroup::'
              exit 1
            }

      - name: Collect IPK artifacts
        run: |
          mkdir -p artifacts
          find "$SDK_DIR/bin/packages" -name '*dormnet*.ipk' -exec cp -v {} artifacts/ \;
          ls -lh artifacts

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dormnet-ipk-openwrt-24.10.2-x86-64
          path: artifacts/*.ipk
          if-no-files-found: error
